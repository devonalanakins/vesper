name: Offline foundation

on:
  push:
    branches: [main, "feat/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Finance contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check derived synthetic evidence fixture
        env:
          PYTHONPATH: src
        run: python scripts/generate_synthetic_evidence.py --check

  web-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate modules
        run: |
          node --check web/logic.mjs
          node --check web/app.mjs
          node --check web/evidence-view.mjs
      - name: Synthetic chart tests
        run: node --test web/logic.test.mjs web/evidence-view.test.mjs
